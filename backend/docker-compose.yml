version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: victoria_postgres
    restart: always
    environment:
      POSTGRES_USER: victoria_user
      POSTGRES_PASSWORD: victoria_password
      POSTGRES_DB: victoria_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: